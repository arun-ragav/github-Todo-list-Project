
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.K.G. Arun Ragav - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <div class="profile">
            <img src="G.K.G.Arun Ragav.png" alt="Profile photo"
                 onerror="this.style.display='none'">
            <div>
                <h1>My To-Do List</h1>
                <p>G.K.G. Arun Ragav</p>
                <span>B.Tech CSE (Applied AI)</span>
            </div>
        </div>
        <button id="themeBtn" class="theme-btn">🌙 Dark Mode</button>
    </header>

    <h2 class="section-title">➕ Add a New Task</h2>

    <section class="add-task-section">
        <input type="text" id="taskInput" placeholder="Enter your task..." autocomplete="off">
        <input type="date" id="taskDate" aria-label="Due date">
        <input type="time" id="taskTime" aria-label="Due time">

        <select id="taskPriority" aria-label="Task priority">
            <option value="high">🔴 High Priority</option>
            <option value="medium" selected>🟡 Medium Priority</option>
            <option value="low">🟢 Low Priority</option>
        </select>

        <select id="taskCategory" aria-label="Task category">
            <option value="study">📚 Study</option>
            <option value="college">🎓 College</option>
            <option value="project">💻 Project</option>
            <option value="personal">🏠 Personal</option>
            <option value="other">📌 Other</option>
        </select>

        <button id="addBtn">Add Task</button>
    </section>

    <div class="search-section">
        <input type="search" id="searchInput"
               placeholder="🔎 Search tasks..." autocomplete="off">

        <select id="sortPriority" aria-label="Sort by priority">
            <option value="default">↕️ Default Order</option>
            <option value="high">🔴 High → Low</option>
            <option value="low">🟢 Low → High</option>
        </select>
    </div>

    <div class="filters">
        <button class="filter-btn active-filter" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <section class="category-filters">
        <h3>Filter by Category</h3>
        <div class="category-buttons">
            <button class="category-btn active-category" data-category="all">📋 All Categories</button>
            <button class="category-btn" data-category="study">📚 Study</button>
            <button class="category-btn" data-category="college">🎓 College</button>
            <button class="category-btn" data-category="project">💻 Project</button>
            <button class="category-btn" data-category="personal">🏠 Personal</button>
            <button class="category-btn" data-category="other">📌 Other</button>
        </div>
    </section>

    <div class="stats">
        <div class="stat-box">
            <h3 id="totalCount">0</h3>
            <p>Total Tasks</p>
        </div>
        <div class="stat-box">
            <h3 id="activeCount">0</h3>
            <p>Active Tasks</p>
        </div>
        <div class="stat-box">
            <h3 id="completedCount">0</h3>
            <p>Completed Tasks</p>
        </div>
    </div>

    <!-- V17 EDIT FORM -->
    <section id="editTaskSection" class="edit-task-section" hidden>
        <h2>✏️ Edit Task</h2>

        <input type="hidden" id="editTaskId">

        <input type="text" id="editTaskInput" placeholder="Task name">

        <input type="date" id="editTaskDate" aria-label="Edit due date">

        <input type="time" id="editTaskTime" aria-label="Edit due time">

        <select id="editTaskPriority" aria-label="Edit priority">
            <option value="high">🔴 High Priority</option>
            <option value="medium">🟡 Medium Priority</option>
            <option value="low">🟢 Low Priority</option>
        </select>

        <select id="editTaskCategory" aria-label="Edit category">
            <option value="study">📚 Study</option>
            <option value="college">🎓 College</option>
            <option value="project">💻 Project</option>
            <option value="personal">🏠 Personal</option>
            <option value="other">📌 Other</option>
        </select>

        <div class="edit-task-actions">
            <button type="button" id="saveEditBtn">💾 Save Changes</button>
            <button type="button" id="cancelEditBtn">Cancel</button>
        </div>
    </section>

    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty-message">No tasks found. Add your first task!</p>

    <footer>
        <p>Built by G.K.G. Arun Ragav | V17 To-Do List</p>
    </footer>

</div>

<script src="app.js"></script>
</body>
</html>
