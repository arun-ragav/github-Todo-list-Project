<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>G.K.G. Arun Ragav - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <h1>📝 My To-Do List</h1>

        <p class="subtitle">
            Organize your daily tasks
        </p>


        <!-- Input Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off"
            >

            <button id="addBtn">
                Add
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList">

            <li>Learn HTML</li>

            <li>Practice CSS</li>

            <li>Learn JavaScript</li>

        </ul>

    </div>


    <script src="app.js"></script>

</body>

</html>
