<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>G.K.G. Arun Ragav - To-Do List</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header>

            <div class="profile">

                <img
                    src="G.K.G.Arun Ragav.png"
                    alt="G.K.G. Arun Ragav">

                <div>

                    <h1>My To-Do List</h1>

                    <p>
                        G.K.G. Arun Ragav
                    </p>

                    <span>
                        B.Tech CSE (Applied AI)
                    </span>

                </div>

            </div>


            <button
                id="themeBtn"
                class="theme-btn">

                🌙 Dark Mode

            </button>

        </header>



        <!-- =====================================
             ADD TASK
        ====================================== -->

        <section class="add-task-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off">


            <input
                type="date"
                id="taskDate">


            <input
                type="time"
                id="taskTime">


            <select id="taskPriority">

                <option value="high">
                    🔴 High Priority
                </option>

                <option
                    value="medium"
                    selected>

                    🟡 Medium Priority

                </option>

                <option value="low">
                    🟢 Low Priority
                </option>

            </select>


            <button id="addBtn">

                Add Task

            </button>

        </section>



        <!-- =====================================
             SEARCH + SORT
        ====================================== -->

        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search your tasks..."
                autocomplete="off">


            <select id="sortPriority">

                <option value="default">

                    ↕️ Default Order

                </option>

                <option value="high">

                    🔴 High → Low

                </option>

                <option value="low">

                    🟢 Low → High

                </option>

            </select>

        </div>



        <!-- =====================================
             FILTER BUTTONS
        ====================================== -->

        <div class="filters">

            <button
                class="filter-btn active-filter"
                data-filter="all">

                All

            </button>


            <button
                class="filter-btn"
                data-filter="active">

                Active

            </button>


            <button
                class="filter-btn"
                data-filter="completed">

                Completed

            </button>

        </div>



        <!-- =====================================
             STATISTICS
        ====================================== -->

        <div class="stats">


            <div class="stat-box">

                <h3 id="totalCount">
                    0
                </h3>

                <p>
                    Total
                </p>

            </div>


            <div class="stat-box">

                <h3 id="activeCount">
                    0
                </h3>

                <p>
                    Active
                </p>

            </div>


            <div class="stat-box">

                <h3 id="completedCount">
                    0
                </h3>

                <p>
                    Completed
                </p>

            </div>

        </div>



        <!-- =====================================
             TASK LIST
        ====================================== -->

        <ul id="taskList"></ul>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="app.js"></script>

</body>

</html>
