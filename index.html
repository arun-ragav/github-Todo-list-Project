<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>G.K.G. Arun Ragav - To-Do List</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header>

            <div class="profile">

                <img
                    src="G.K.G.Arun Ragav.png"
                    alt="G.K.G. Arun Ragav">

                <div>

                    <h1>My To-Do List</h1>

                    <p>
                        G.K.G. Arun Ragav
                    </p>

                    <span>
                        B.Tech CSE (Applied AI)
                    </span>

                </div>

            </div>


            <!-- THEME BUTTON -->

            <button
                id="themeBtn"
                class="theme-btn">

                🌙 Dark Mode

            </button>

        </header>



        <!-- =====================================
             ADD TASK
        ====================================== -->

        <section class="add-task-section">


            <!-- TASK -->

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off">


            <!-- DATE -->

            <input
                type="date"
                id="taskDate">


            <!-- TIME -->

            <input
                type="time"
                id="taskTime">


            <!-- PRIORITY -->

            <select id="taskPriority">

                <option value="high">

                    🔴 High Priority

                </option>


                <option
                    value="medium"
                    selected>

                    🟡 Medium Priority

                </option>


                <option value="low">

                    🟢 Low Priority

                </option>

            </select>


            <!-- CATEGORY -->

            <select id="taskCategory">

                <option value="study">

                    📚 Study

                </option>


                <option value="college">

                    🎓 College

                </option>


                <option value="project">

                    💻 Project

                </option>


                <option value="personal">

                    🏠 Personal

                </option>


                <option value="other">

                    📌 Other

                </option>

            </select>


            <!-- ADD BUTTON -->

            <button id="addBtn">

                Add Task

            </button>

        </section>



        <!-- =====================================
             SEARCH + SORT
        ====================================== -->

        <div class="search-section">


            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search your tasks..."
                autocomplete="off">


            <!-- SORT -->

            <select id="sortPriority">


                <option value="default">

                    ↕️ Default Order

                </option>


                <option value="high">

                    🔴 High → Low

                </option>


                <option value="low">

                    🟢 Low → High

                </option>


            </select>

        </div>



        <!-- =====================================
             FILTER BUTTONS
        ====================================== -->

        <div class="filters">


            <button
                class="filter-btn active-filter"
                data-filter="all">

                All

            </button>


            <button
                class="filter-btn"
                data-filter="active">

                Active

            </button>


            <button
                class="filter-btn"
                data-filter="completed">

                Completed

            </button>

        </div>



        <!-- =====================================
             STATISTICS
        ====================================== -->

        <div class="stats">


            <div class="stat-box">

                <h3 id="totalCount">

                    0

                </h3>

                <p>

                    Total

                </p>

            </div>



            <div class="stat-box">

                <h3 id="activeCount">

                    0

                </h3>

                <p>

                    Active

                </p>

            </div>



            <div class="stat-box">

                <h3 id="completedCount">

                    0

                </h3>

                <p>

                    Completed

                </p>

            </div>


        </div>



        <!-- =====================================
             TASK LIST
        ====================================== -->

        <ul id="taskList"></ul>


    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="app.js"></script>


</body>

</html>
