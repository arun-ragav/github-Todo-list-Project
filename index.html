<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G.K.G. Arun Ragav | To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header class="header">

            <h1>📝 My To-Do List</h1>

            <p>Organize your daily tasks</p>

        </header>


        <!-- User Identity -->

        <section class="profile">

            <h2>G.K.G. Arun Ragav</h2>

            <p>B.Tech CSE (Applied AI)</p>

            <p>St. Joseph University, Palanchur</p>

        </section>


        <!-- Input Section -->

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off"
            >

            <button id="addBtn">
                Add
            </button>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


    </div>


    <script src="app.js"></script>

</body>

</html>
