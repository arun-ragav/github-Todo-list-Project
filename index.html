<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>G.K.G. Arun Ragav | To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header class="header">

            <h1>📝 My To-Do List</h1>

            <p>Organize your daily tasks</p>

        </header>


        <!-- Profile -->

        <section class="profile">

            <h2>G.K.G. Arun Ragav</h2>

            <p>B.Tech CSE (Applied AI)</p>

            <p>St. Joseph University, Palanchur</p>

        </section>


        <!-- Add Task -->

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off"
            >

            <button id="addBtn">
                Add
            </button>

        </div>


        <!-- Filters -->

        <div class="filters">

            <button
                class="filter-btn active-filter"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task Statistics -->

        <div class="stats">

            <div class="stat-box">

                <span id="totalCount">0</span>

                <p>Total</p>

            </div>


            <div class="stat-box">

                <span id="activeCount">0</span>

                <p>Active</p>

            </div>


            <div class="stat-box">

                <span id="completedCount">0</span>

                <p>Completed</p>

            </div>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


    </div>


    <script src="app.js"></script>

</body>

</html>
